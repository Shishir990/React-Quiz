<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizora</title>
    <!-- Apply the saved light/dark choice before the first paint, so there is no flash -->
    <script>
      try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
    </script>
    <!-- Dark background until the app's own styles arrive, so dark mode never flashes white -->
    <style>html:not([data-theme='light']) body { background: #0C0D0C; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
